<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111211">
<meta name="robots" content="noindex, follow">
<meta name="google-adsense-account" content="ca-pub-3654708143461818">
<title>Page not found · Korvexa Calendar</title>
<link rel="icon" href="/korvexa-mark.png" type="image/png">
<link rel="stylesheet" href="/style.css?v=6">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3654708143461818" crossorigin="anonymous"></script>
<style>
  .not-found {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--shell);
    color: #d4d8ce;
    position: relative;
    overflow: hidden;
  }

  /* Decorative grid rules */
  .not-found__rules {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .not-found__rule {
    position: absolute;
    background: rgba(255,255,255,.04);
  }
  .not-found__rule--1 { top: 0; left: 86px; width: 1px; height: 100%; }
  .not-found__rule--2 { top: 0; right: 0; width: 1px; height: 100%; }
  .not-found__rule--3 { top: 50%; left: 0; width: 100%; height: 1px; }

  /* Vertical KORVEXA watermark */
  .not-found__watermark {
    position: absolute;
    top: 4rem;
    right: 0;
    transform: translate(35%);
    pointer-events: none;
    user-select: none;
    opacity: 0;
    animation: watermark-in .5s cubic-bezier(0,.55,.45,1) .7s forwards;
  }
  .not-found__watermark-text {
    font-family: 'DM Sans', sans-serif;
    font-size: clamp(9rem, 18vw, 26rem);
    font-weight: 700;
    color: #d4d8ce;
    opacity: .06;
    letter-spacing: -.03em;
    white-space: nowrap;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    transform: rotate(180deg);
    line-height: .85;
    mask-image: linear-gradient(#000 15%, transparent 85%);
    display: block;
  }
  @keyframes watermark-in {
    from { opacity: 0; transform: translate(35%) translateY(14px); }
    to   { opacity: 1; transform: translate(35%) translateY(0); }
  }
  @media (max-width: 640px) { .not-found__watermark { display: none; } }

  /* Page header */
  .not-found__header {
    padding: 24px 32px 24px calc(86px + 32px);
    display: flex;
    align-items: center;
    gap: 20px;
    border-bottom: 1px solid rgba(255,255,255,.06);
    position: relative;
    z-index: 1;
  }
  .not-found__back {
    font-size: 12px;
    color: #6b7067;
    transition: color .15s;
  }
  .not-found__back:hover { color: var(--lime); }

  /* Main layout */
  .not-found__layout {
    flex: 1;
    display: grid;
    grid-template-columns: 64px 1fr;
    gap: 0;
    padding: 0 32px 0 calc(86px + 32px);
    align-items: center;
    position: relative;
    z-index: 1;
  }

  /* Coordinate column */
  .not-found__coords {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-right: 24px;
  }
  .not-found__coord {
    font-size: 10px;
    color: #505650;
    letter-spacing: .05em;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    transform: rotate(180deg);
  }

  /* Content */
  .not-found__content {
    padding: 80px 0;
    max-width: 560px;
  }

  .not-found__number-wrap {
    line-height: 1;
    margin-bottom: 32px;
  }
  .not-found__number {
    font-size: clamp(6rem, 18vw, 16rem);
    font-weight: 700;
    letter-spacing: -.05em;
    color: var(--lime);
    opacity: .18;
    line-height: 1;
    display: block;
    animation: num-in .4s cubic-bezier(0,.55,.45,1) .1s both;
  }

  .not-found__eyebrow {
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: #505650;
    margin: 0 0 16px;
    animation: copy-in .4s cubic-bezier(0,.55,.45,1) .25s both;
  }

  .not-found__heading {
    font-size: clamp(1.75rem, 4vw, 3rem);
    font-weight: 600;
    letter-spacing: -.04em;
    line-height: 1.1;
    color: #e8ece4;
    margin: 0 0 20px;
    animation: copy-in .4s cubic-bezier(0,.55,.45,1) .32s both;
    text-wrap: balance;
  }

  .not-found__body {
    font-size: 14px;
    line-height: 1.65;
    color: #72766f;
    margin: 0 0 40px;
    animation: copy-in .4s cubic-bezier(0,.55,.45,1) .38s both;
  }

  .not-found__actions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    animation: copy-in .4s cubic-bezier(0,.55,.45,1) .46s both;
  }

  .not-found__action--primary {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 11px 20px;
    background: var(--lime);
    color: var(--ink);
    font-size: 13px;
    font-weight: 500;
    border-radius: 12px;
    transition: opacity .15s;
  }
  .not-found__action--primary:hover { opacity: .85; }

  .not-found__action--secondary {
    display: inline-flex;
    align-items: center;
    padding: 11px 20px;
    border: 1px solid #2c3029;
    color: #8b9087;
    font-size: 13px;
    border-radius: 12px;
    transition: border-color .15s, color .15s;
  }
  .not-found__action--secondary:hover { border-color: #454d41; color: #c8ccc4; }

  .not-found__action--back {
    background: none;
    padding: 11px 0;
    font-size: 13px;
    color: #505650;
    transition: color .15s;
  }
  .not-found__action--back:hover { color: #8b9087; }

  @keyframes num-in  { from { opacity: 0; transform: translateY(12px); } to { opacity: .18; transform: none; } }
  @keyframes copy-in { from { opacity: 0; transform: translateY(8px); }  to { opacity: 1;   transform: none; } }

  @media (max-width: 680px) {
    .not-found__layout  { grid-template-columns: 1fr; padding: 0 20px 0 20px; }
    .not-found__coords  { display: none; }
    .not-found__content { padding: 48px 0 64px; }
    .not-found__header  { padding: 20px 20px; }
  }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="not-found" id="main">
  <!-- Decorative grid rules -->
  <div class="not-found__rules" aria-hidden="true">
    <div class="not-found__rule not-found__rule--1"></div>
    <div class="not-found__rule not-found__rule--2"></div>
    <div class="not-found__rule not-found__rule--3"></div>
  </div>

  <!-- Vertical watermark -->
  <div class="not-found__watermark" aria-hidden="true">
    <span class="not-found__watermark-text">KOR</span>
  </div>

  <!-- Header -->
  <header class="not-found__header">
    <a href="/" aria-label="Korvexa Calendar home">
      <img src="/korvexa-mark.png" width="32" height="32" alt="Korvexa">
    </a>
    <a class="not-found__back" href="/">← Calendar</a>
  </header>

  <!-- Content -->
  <main class="not-found__layout">
    <div class="not-found__coords" aria-hidden="true">
      <span class="not-found__coord">§ 404</span>
    </div>
    <div class="not-found__content">
      <div class="not-found__number-wrap" aria-hidden="true">
        <span class="not-found__number">404</span>
      </div>
      <p class="not-found__eyebrow">404 / Route not found</p>
      <h1 class="not-found__heading">This route leads nowhere.</h1>
      <p class="not-found__body">The page may have moved, changed, or never existed. The calendar is still here.</p>
      <div class="not-found__actions">
        <a href="/" class="not-found__action--primary">Return to calendar →</a>
        <a href="/privacy" class="not-found__action--secondary">Privacy policy</a>
        <button id="not-found-back" class="not-found__action--back" type="button" hidden>Go back</button>
      </div>
    </div>
  </main>
</div>
<script>
  var btn = document.getElementById('not-found-back');
  if (btn && window.history.length > 1) {
    btn.hidden = false;
    btn.addEventListener('click', function() { window.history.back(); });
  }
</script>
</body>
</html>
